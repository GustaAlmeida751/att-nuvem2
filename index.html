<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViajaFácil - Planejador de Viagens & Feriados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #e0f2fe;
            --secondary: #0d9488;
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --transition: all 0.2s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: var(--shadow-sm);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-dark);
            text-decoration: none;
        }
        .logo-icon {
            background: var(--primary);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-tabs {
            display: flex;
            background-color: var(--bg-main);
            padding: 0.25rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            gap: 0.25rem;
        }
        .nav-tab-btn {
            border: none;
            background: transparent;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }
        .nav-tab-btn.active {
            background-color: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; border-color: var(--border); color: var(--text-dark); }
        .btn-outline:hover { background-color: var(--bg-main); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
        .controls-card {
            background-color: var(--surface);
            border-radius: var(--radius);
            padding: 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            padding: 0.6rem 0.8rem;
            font-size: 0.875rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            outline: none;
            background-color: var(--surface);
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .holiday-card {
            background-color: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }
        .holiday-date {
            background-color: var(--primary-light);
            color: var(--primary-hover);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .plan-card {
            background-color: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .plan-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .plan-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-Planejada { background-color: #fef3c7; color: #b45309; }
        .badge-Confirmada { background-color: #dbeafe; color: #1d4ed8; }
        .badge-Concluída { background-color: #d1fae5; color: #047857; }
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            margin: 1rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            background: var(--bg-main);
        }
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 60;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: var(--text-dark);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-lg);
        }
        .toast.success { background-color: var(--success); }
        .toast.error { background-color: var(--danger); }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        @media (max-width: 640px) {
            .header-container { flex-direction: column; }
            .nav-tabs { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-plane-departure"></i></div>
                <span>ViajaFácil</span>
            </a>
            <nav class="nav-tabs">
                <button class="nav-tab-btn active" onclick="switchTab('holidays-tab')">
                    <i class="fa-solid fa-calendar-days"></i> Feriados (API)
                </button>
                <button class="nav-tab-btn" onclick="switchTab('plans-tab')">
                    <i class="fa-solid fa-suitcase"></i> Minhas Viagens
                </button>
            </nav>
        </div>
    </header>
    <main>
        <section id="holidays-tab" class="tab-content active">
            <div class="controls-card">
                <div class="form-group">
                    <label for="country-select">País</label>
                    <select id="country-select" class="form-control">
                        <option value="BR" selected>Brasil 🇧🇷</option>
                        <option value="US">Estados Unidos 🇺🇸</option>
                        <option value="ES">Espanha 🇪🇸</option>
                        <option value="FR">França 🇫🇷</option>
                        <option value="IT">Itália 🇮🇹</option>
                        <option value="PT">Portugal 🇵🇹</option>
                        <option value="AR">Argentina 🇦🇷</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year-select">Ano</label>
                    <select id="year-select" class="form-control">
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="fetchHolidays()">
                    <i class="fa-solid fa-magnifying-glass"></i> Buscar Feriados
                </button>
            </div>
            <div id="holidays-grid" class="cards-grid"></div>
        </section>
        <section id="plans-tab" class="tab-content">
            <div class="controls-card" style="justify-content: space-between;">
                <div style="display: flex; gap: 1rem; flex: 1; flex-wrap: wrap;">
                    <div class="form-group">
                        <label for="search-plan-input">Buscar</label>
                        <input type="text" id="search-plan-input" class="form-control" placeholder="Destino ou feriado..." oninput="renderPlans()">
                    </div>
                    <div class="form-group">
                        <label for="filter-status-select">Status</label>
                        <select id="filter-status-select" class="form-control" onchange="renderPlans()">
                            <option value="ALL">Todos</option>
                            <option value="Planejada">Planejada</option>
                            <option value="Confirmada">Confirmada</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="openCreatePlanModal()">
                    <i class="fa-solid fa-plus"></i> Nova Viagem
                </button>
            </div>
            <div id="plans-list" class="plans-list"></div>
        </section>
    </main>
    <div id="toast-container" class="toast-container"></div>
    <div id="plan-form-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3 id="plan-modal-title">Cadastrar Viagem</h3>
                <button style="border:none; background:none; cursor:pointer;" onclick="closeModal('plan-form-modal')">&times;</button>
            </div>
            <form id="plan-form" onsubmit="handleSavePlan(event)">
                <div class="modal-body">
                    <input type="hidden" id="plan-id">
                    <div class="form-group">
                        <label for="plan-destination">Destino *</label>
                        <input type="text" id="plan-destination" class="form-control" placeholder="Ex: Rio de Janeiro" required>
                    </div>
                    <div class="form-group">
                        <label for="plan-holiday">Feriado *</label>
                        <input type="text" id="plan-holiday" class="form-control" placeholder="Ex: Carnaval" required>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group">
                            <label for="plan-date-start">Início *</label>
                            <input type="date" id="plan-date-start" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="plan-date-end">Fim *</label>
                            <input type="date" id="plan-date-end" class="form-control" required>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group">
                            <label for="plan-budget">Orçamento (R$)</label>
                            <input type="number" id="plan-budget" class="form-control" placeholder="0.00" step="50">
                        </div>
                        <div class="form-group">
                            <label for="plan-status">Status</label>
                            <select id="plan-status" class="form-control">
                                <option value="Planejada">Planejada</option>
                                <option value="Confirmada">Confirmada</option>
                                <option value="Concluída">Concluída</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="plan-notes">Observações</label>
                        <textarea id="plan-notes" class="form-control" rows="2" placeholder="Notas adicionais..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal('plan-form-modal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="save-plan-btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAhfih0yfrK5wqKZqkhZtBb-sQDi1GXwZU",
            authDomain: "nuvem2gustavo.firebaseapp.com",
            projectId: "nuvem2gustavo",
            storageBucket: "nuvem2gustavo.firebasestorage.app",
            messagingSenderId: "619335162266",
            appId: "1:619335162266:web:35192cb7fcb7a543ff0223"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let plans = [];
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const btn = Array.from(document.querySelectorAll('.nav-tab-btn')).find(b => b.getAttribute('onclick').includes(tabId));
            if (btn) btn.classList.add('active');
        };
        window.openModal = id => document.getElementById(id).classList.add('open');
        window.closeModal = id => document.getElementById(id).classList.remove('open');
        function subscribeToPlans() {
            onSnapshot(collection(db, 'viagens'), snapshot => {
                plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderPlans();
            }, error => {
                console.error("Erro no Firestore:", error);
                showToast("Erro ao carregar viagens do Firestore.", "error");
            });
        }
        window.handleSavePlan = async function(e) {
            e.preventDefault();
            const id = document.getElementById('plan-id').value;
            const destination = document.getElementById('plan-destination').value.trim();
            const holiday = document.getElementById('plan-holiday').value.trim();
            const startDate = document.getElementById('plan-date-start').value;
            const endDate = document.getElementById('plan-date-end').value;
            const budget = parseFloat(document.getElementById('plan-budget').value) || 0;
            const status = document.getElementById('plan-status').value;
            const notes = document.getElementById('plan-notes').value.trim();
            const planData = { destination, holiday, startDate, endDate, budget, status, notes, updatedAt: serverTimestamp() };
            try {
                if (id) {
                    await updateDoc(doc(db, 'viagens', id), planData);
                    showToast("Viagem atualizada!", "success");
                } else {
                    planData.createdAt = serverTimestamp();
                    await addDoc(collection(db, 'viagens'), planData);
                    showToast("Viagem salva!", "success");
                }
                closeModal('plan-form-modal');
                document.getElementById('plan-form').reset();
            } catch (err) {
                console.error(err);
                showToast("Erro ao salvar no banco.", "error");
            }
        };
        window.deletePlan = async function(id) {
            if (!confirm("Deseja mesmo excluir esta viagem?")) return;
            try {
                await deleteDoc(doc(db, 'viagens', id));
                showToast("Viagem removida.", "info");
            } catch (err) {
                showToast("Erro ao remover.", "error");
            }
        };
        window.editPlan = function(id) {
            const plan = plans.find(p => p.id === id);
            if (!plan) return;
            document.getElementById('plan-id').value = plan.id;
            document.getElementById('plan-destination').value = plan.destination || '';
            document.getElementById('plan-holiday').value = plan.holiday || '';
            document.getElementById('plan-date-start').value = plan.startDate || '';
            document.getElementById('plan-date-end').value = plan.endDate || '';
            document.getElementById('plan-budget').value = plan.budget || '';
            document.getElementById('plan-status').value = plan.status || 'Planejada';
            document.getElementById('plan-notes').value = plan.notes || '';
            document.getElementById('plan-modal-title').innerText = 'Editar Viagem';
            openModal('plan-form-modal');
        };
        window.openCreatePlanModal = function(holidayName = '', date = '') {
            document.getElementById('plan-form').reset();
            document.getElementById('plan-id').value = '';
            document.getElementById('plan-modal-title').innerText = 'Nova Viagem';
            if (holidayName) document.getElementById('plan-holiday').value = holidayName;
            if (date) {
                document.getElementById('plan-date-start').value = date;
                document.getElementById('plan-date-end').value = date;
            }
            openModal('plan-form-modal');
        };
        window.renderPlans = function() {
            const container = document.getElementById('plans-list');
            const search = document.getElementById('search-plan-input').value.toLowerCase();
            const filter = document.getElementById('filter-status-select').value;

            const filtered = plans.filter(p => {
                const matchesSearch = (p.destination && p.destination.toLowerCase().includes(search)) ||
                                      (p.holiday && p.holiday.toLowerCase().includes(search));
                const matchesStatus = filter === 'ALL' || p.status === filter;
                return matchesSearch && matchesStatus;
            });
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">Nenhuma viagem encontrada.</div>`;
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="plan-card">
                    <div class="plan-info">
                        <h3>${escapeHtml(p.destination)}</h3>
                        <div class="plan-meta">
                            <span><i class="fa-solid fa-calendar"></i> ${p.startDate || ''} até ${p.endDate || ''} (${escapeHtml(p.holiday)})</span>
                            <span><i class="fa-solid fa-wallet"></i> R$ ${(p.budget || 0).toFixed(2)}</span>
                            <span class="badge badge-${p.status}">${p.status || 'Planejada'}</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline btn-sm" onclick="editPlan('${p.id}')"><i class="fa-solid fa-pen"></i> Editar</button>
                        <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        };
        window.fetchHolidays = async function() {
            const country = document.getElementById('country-select').value;
            const year = document.getElementById('year-select').value;
            const grid = document.getElementById('holidays-grid');
            grid.innerHTML = `<div class="empty-state">Carregando feriados...</div>`;
            try {
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${country}`);
                if (!response.ok) throw new Error('Erro na API');   
                const holidays = await response.json();
                renderHolidays(holidays);
            } catch (err) {
                grid.innerHTML = `<div class="empty-state">Erro ao buscar feriados da API.</div>`;
            }
        };
        function renderHolidays(list) {
            const grid = document.getElementById('holidays-grid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="empty-state">Nenhum feriado encontrado.</div>`;
                return;
            }
            grid.innerHTML = list.map(h => `
                <div class="holiday-card">
                    <div>
                        <span class="holiday-date">${h.date}</span>
                        <h3 style="font-size: 1rem; margin-top:0.25rem;">${escapeHtml(h.localName)}</h3>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${escapeHtml(h.name)}</p>
                    </div>
                    <button class="btn btn-outline btn-sm" style="width:100%;" onclick="importHoliday('${escapeHtml(h.localName)}', '${h.date}')">
                        <i class="fa-solid fa-plus"></i> Planejar Viagem
                    </button>
                </div>
            `).join('');
        }
        window.importHoliday = function(name, date) {
            switchTab('plans-tab');
            openCreatePlanModal(name, date);
        };
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }
             window.addEventListener('DOMContentLoaded', () => {
            subscribeToPlans();
            fetchHolidays();
        });
    </script>
</body>
</html>
